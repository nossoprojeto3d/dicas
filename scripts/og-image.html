<!doctype html>
<!-- Fonte da prévia do WhatsApp (og-image.jpg, 1200×630). Para regenerar: abra num navegador em 1200×630,
     tire o print, salve como og-image.jpg na raiz e aumente o ?v= do og:image no index.html. -->
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=JetBrains+Mono:wght@700&display=swap">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#F6F4EF;font-family:Archivo,system-ui,sans-serif;color:#141414;display:flex;align-items:center;gap:64px;padding:0 90px;box-sizing:border-box;position:relative}
  body::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgb(20 20 20 / .07) 1.4px,transparent 1.4px);background-size:22px 22px}
  img{position:relative;width:250px;height:auto}
  .texto{position:relative;display:flex;flex-direction:column;gap:18px}
  .tag{font:700 26px/1 "JetBrains Mono",monospace;letter-spacing:.06em;color:#9C1A49}
  h1{margin:0;font-size:96px;font-weight:900;line-height:.98;letter-spacing:-.03em}
  h1 span{background:linear-gradient(transparent 60%,#FFCADC 60%)}
  p{margin:0;font-size:30px;font-weight:800;color:#C2255C}
</style></head>
<body>
  <img src="../logo.png" alt="">
  <div class="texto">
    <div class="tag">#DICASNOSSOPROJETO3D</div>
    <h1>Dicas de <span>impressão 3D</span></h1>
    <p>Ache a dica pelo número do vídeo</p>
  </div>
</body></html>
